# Builds the handbook website from docs/ and publishes it on GitHub Pages.
# Runs automatically whenever something in docs/ or mkdocs.yml changes on main,
# and can also be started by hand (Actions tab -> "Publish handbook website" -> Run workflow).
name: Publish handbook website

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - ".github/workflows/deploy-wiki.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Safety check - refuse to publish anything that is not approved
        run: |
          python - <<'PY'
          import pathlib, re, sys
          bad = []
          for p in pathlib.Path("docs/handbook").glob("*.md"):
              if p.name == "index.md":
                  continue
              t = p.read_text(encoding="utf-8")
              if not re.search(r"^status:\s*APPROVED\s*$", t, re.M) or re.search(r"awaiting researcher review", t, re.I):
                  bad.append(p.name)
          if bad:
              print("These pages are not approved and will NOT be published:", ", ".join(bad))
              print("Approve them in wiki/ and run publish_wiki.py, or remove them from docs/handbook/.")
              sys.exit(1)
          print("All handbook pages are approved.")
          PY
      - run: pip install -r requirements.txt
      - run: mkdocs build --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
